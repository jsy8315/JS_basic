<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="main4.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="card-background">
      <div class="card-box">
        <img src="img/card1.png">
      </div>
      <div class="card-box">
        <img src="img/card2.png">
      </div>
      <div class="card-box">
        <img src="img/card3.png">
      </div>
    </div>

    <script>
      $(window).scroll(function(){
        var 높이 = $(window).scrollTop();

        // 650-1150까지 스크롤바 내리면 첫째카드의 opacity를 1 > 0으로 서서히 변경하기
        var y = -(1 / 500) * 높이 + (1150 / 500)
        $('.card-box').eq(0).css('opacity', y);

        // 1350-1950까지 스크롤바 내리면 첫째카드의 opacity를 1 > 0으로 서서히 변경하기
        var y = -(1 / 600) * 높이 + (1950 / 600)
        $('.card-box').eq(1).css('opacity', y);

        // 650-1150까지 스크롤바 내리면 첫째카드의 scale을 1 > 0.9으로 서서히 변경하기
        if (높이 >= 650) {
          var scaleCard = -(0.1 / 500) * 높이 + (5650 / 5000);
        $('.card-box').eq(0).css('scale', scaleCard);
        }

        // 1350-1950까지 스크롤바 내리면 첫째카드의 scale을 1 > 0.9으로 서서히 변경하기
        if (높이 >= 1350) {
          var scaleCard = -(0.1 / 600) * 높이 + (7350 / 6000);
        $('.card-box').eq(1).css('scale', scaleCard);
        }
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
